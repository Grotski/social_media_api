{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
<div class="min-h-screen flex items-center justify-center bg-blue-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-6 rounded-lg shadow-md">
        <div>
            <h2 class="mt-6 text-center text-2xl font-extrabold text-gray-900">Login</h2>
        </div>
        <form id="login-form" method="post" class="mt-8 space-y-6">
            {% csrf_token %}

            <div class="rounded-md shadow-sm -space-y-px">
                <div class="mt-4">
                    <label for="{{ form.email.id_for_label }}" class="sr-only">Email</label>
                    <input id="{{ form.email.id_for_label }}" type="email" name="{{ form.email.name }}" required
                        class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                        placeholder="Email">
                </div>
                <div class="mt-4">
                    <label for="{{ form.password.id_for_label }}" class="sr-only">Password</label>
                    <input id="{{ form.password.id_for_label }}" type="password" name="{{ form.password.name }}"
                        required
                        class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                        placeholder="Password">
                </div>
            </div>

            <div>
                <button
                    class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                    type="submit">
                    Login
                </button>
            </div>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("{{ form.email.id_for_label }}").value;
      const password = document.getElementById("{{ form.password.id_for_label }}").value;

      const response = await fetch("/api/user/login/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ email, password }),
      });

      const result = document.getElementById("result");

      if (response.ok) {
        const data = await response.json();
        result.innerHTML = `<strong>Access Token:</strong><br><code>${data.access}</code><br><br><strong>Refresh Token:</strong><br><code>${data.refresh}</code>`;

        // Optionally: store the token
        // localStorage.setItem("access_token", data.access);
      } else {
        const error = await response.json();
        result.innerHTML = `<span style="color: red;">Login failed: ${error.detail || "Invalid credentials"}</span>`;
      }
    });
</script>
{% endblock %}
