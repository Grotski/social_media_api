<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Chat App{% endblock %}</title>
</head>
<body>
    <nav>
        {% if user.is_authenticated %}
            <p>Hi, {{ user.username }} | <a href="/logout/">Logout</a></p>
        {% else %}
            <a href="/api/user/login/">Login</a> | <a href="/api/user/register/">Register</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
